  --bg:color-mix(in srgb,var(--cor) 8%,#05070A);
  --s1:color-mix(in srgb,var(--cor) 10%,rgba(12,15,18,.84)); --s2:color-mix(in srgb,var(--cor) 12%,#0F1316); --s3:color-mix(in srgb,var(--cor) 17%,#151A1E);
  --line:color-mix(in srgb,var(--cor) 22%,rgba(255,255,255,.08)); --line2:color-mix(in srgb,var(--cor) 30%,rgba(255,255,255,.15));
  --txt:#EAF1EC; --mut:#97A89D; --mut2:#66776C;
  --ok:#4ADE80; --teste:#FBBF24; --conf:#F87171; --parado:#7C8A82;
  --cor:#32923C; --acc:color-mix(in srgb,var(--cor) 62%,#fff);
  --side-w:276px; --ease:cubic-bezier(.16,1,.3,1);
  --f-tit:"Montserrat","Segoe UI",system-ui,sans-serif;
  --f-txt:"Montserrat","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{font-family:var(--f-txt);font-size:15px;line-height:1.5;color:var(--txt);background:linear-gradient(115deg,color-mix(in srgb,var(--cor) 24%,#03050A) 0%,var(--bg) 48%,color-mix(in srgb,var(--cor) 14%,#03050A) 100%) fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(color-mix(in srgb,var(--cor) 30%,rgba(255,255,255,.08)) 1px,transparent 1px);background-size:22px 22px;
  mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.3) 75%,transparent)}
body::after{content:'';position:fixed;z-index:0;pointer-events:none;width:900px;height:900px;border-radius:50%;top:-460px;right:-280px;
  background:radial-gradient(circle,color-mix(in srgb,var(--cor) 20%,transparent),transparent 62%);transition:background .8s;
  animation:deriva 20s ease-in-out infinite alternate}
@keyframes deriva{to{transform:translate(-140px,90px)}}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono)}
[hidden]{display:none!important}

/* =================== tela de escolha (arte de fundo) =================== */
#escolha{position:fixed;inset:0;z-index:1;overflow:hidden;background:#05090F}
.palco{position:absolute;background:var(--arte) center/100% 100% no-repeat;transform-origin:center;
  transition:transform 1.2s var(--ease),filter .6s;animation:abre 1.6s var(--ease) both}
@keyframes abre{from{transform:scale(1.06);filter:brightness(.4) blur(6px)}to{transform:none;filter:none}}
#escolha.foco-esq .palco{transform:scale(1.025) translateX(.6%)}
#escolha.foco-dir .palco{transform:scale(1.025) translateX(-.6%)}
.lado{position:absolute;top:0;bottom:0;width:50%;text-decoration:none;color:#fff;transition:background .6s var(--ease)}
.lado.esq{left:0}.lado.dir{right:0}
#escolha::before,#escolha::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .7s var(--ease)}
#escolha::before{background:linear-gradient(90deg,transparent 30%,rgba(3,6,12,.6) 75%)}
#escolha::after{background:linear-gradient(270deg,transparent 30%,rgba(3,6,12,.6) 75%)}
#escolha.foco-esq::before,#escolha.foco-dir::after{opacity:1}
.lado{z-index:2}
.alvo{position:absolute;display:flex;flex-direction:column;align-items:center;gap:16px;transform:translateX(-50%);
  opacity:0;animation:surge 1s var(--ease) forwards;animation-delay:.9s}
.lado.dir .alvo{animation-delay:.9s}
@keyframes surge{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.alvo .desc{font-size:clamp(10px,.95vw,14px);font-weight:400;letter-spacing:.34em;text-transform:uppercase;text-align:center;line-height:1.7;color:rgba(255,255,255,.8);white-space:nowrap}
.alvo .ir{display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:999px;
  font-size:clamp(11px,.85vw,13px);font-weight:600;letter-spacing:.28em;text-transform:uppercase;white-space:nowrap;
  border:1px solid rgba(255,255,255,.35);background:rgba(5,10,18,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:all .45s var(--ease)}
.alvo .ir svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ease)}
.lado:hover .ir,.lado:focus-visible .ir{background:var(--cor);border-color:var(--cor);box-shadow:0 0 34px -4px var(--cor),0 0 0 6px color-mix(in srgb,var(--cor) 22%,transparent)}
.lado:hover .ir svg{transform:translateX(5px)}
.lado:focus-visible{outline:none}
.halo{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.8);
  background:radial-gradient(circle,color-mix(in srgb,var(--cor) 45%,transparent),transparent 65%);mix-blend-mode:screen;transition:opacity .6s,transform .8s var(--ease)}
.lado:hover .halo,.lado:focus-visible .halo{opacity:.55;transform:translate(-50%,-50%) scale(1)}
.marca-topo{position:absolute;left:50%;bottom:max(6%,calc(22px + env(safe-area-inset-bottom,0px)));transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap;
  font-size:clamp(10px,.9vw,13px);font-weight:400;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,255,255,.72);
  opacity:0;animation:surge2 1.2s var(--ease) forwards;animation-delay:.5s}
.marca-topo b{display:block;font-size:clamp(16px,1.7vw,24px);font-weight:500;letter-spacing:.42em;color:#fff;margin-top:8px}
.marca-topo i{display:block;width:60px;height:1px;margin:0 auto 16px;background:linear-gradient(90deg,#3B82F6,#22C55E)}
@keyframes surge2{to{opacity:1}}
.outras{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.outras a{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:#fff;padding:9px 18px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--cor) 60%,transparent);background:rgba(5,10,18,.6);backdrop-filter:blur(8px)}
.outras a:hover{background:var(--cor)}
.sem-emp{position:absolute;inset:0;display:grid;place-items:center;padding:20px}

/* celular em pé: cada empresa ocupa metade da altura, com o seu lado da arte */
@media (orientation:portrait) and (max-width:900px){
  .palco,.marca-topo{display:none}
  .lado{left:0;right:0;width:auto;height:50%;background-image:var(--arte);background-size:auto 118%;background-repeat:no-repeat;isolation:isolate}
  .lado.esq{top:0;bottom:auto;background-position:0% 40%;border-bottom:1px solid rgba(255,255,255,.08)}
  .lado.dir{top:auto;bottom:0;background-position:100% 40%}
  .lado.dir .alvo{bottom:16%}
  .lado::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(3,6,12,0) 30%,rgba(3,6,12,.6))}
  .lado .alvo{left:50%;bottom:11%}
  .lado .halo,.alvo .desc{display:none}
  #escolha.foco-esq .lado.dir,#escolha.foco-dir .lado.esq{background-color:transparent}
}

/* =================== aplicação com barra lateral =================== */
#app{position:relative;z-index:1;display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);z-index:300;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);
  padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.side-emp{position:relative;padding:6px 8px 4px}
.side-emp .logo{height:44px;display:flex;align-items:center;position:relative}
.side-emp img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 18px color-mix(in srgb,var(--cor) 55%,transparent))}
.side-emp .logo-txt{font-size:22px;text-align:left}
/* seletor de empresa: trilho com a pílula que desliza */
.seletor{--n:2;--i:0;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);margin-top:16px;padding:4px;border-radius:12px;
  background:color-mix(in srgb,var(--cor) 8%,rgba(255,255,255,.04));border:1px solid var(--line)}
.seletor .pilula{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));border-radius:9px;
  transform:translateX(calc(var(--i) * 100%));transition:transform .5s var(--ease),background .5s;
  background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 85%,#fff 8%),color-mix(in srgb,var(--pc) 70%,#000));
  box-shadow:0 6px 18px -6px var(--pc),inset 0 1px 0 rgba(255,255,255,.18)}
.seletor button{position:relative;z-index:1;height:34px;padding:0 8px;border-radius:9px;font-size:12.5px;font-weight:600;
  color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.seletor button:hover{color:var(--txt)}
.seletor button[aria-current="true"]{color:#fff;cursor:default}

.menu{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;margin:14px -6px 0;padding:2px 6px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.indicador{position:absolute;top:0;left:6px;width:0;height:0;border-radius:10px;pointer-events:none;opacity:0;z-index:0;
  background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 20%,transparent),color-mix(in srgb,var(--acc) 5%,transparent));
  border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);
  transition:top .45s var(--ease),height .45s var(--ease),left .45s var(--ease),width .45s var(--ease),opacity .3s}
.indicador::before{content:'';position:absolute;left:-1px;top:22%;bottom:22%;width:3px;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
/* borda de luz girando em volta do item selecionado */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.indicador::after{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0deg,transparent 200deg,color-mix(in srgb,var(--acc) 60%,transparent) 260deg,#fff 300deg,var(--acc) 320deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:giraBorda 2.6s linear infinite;filter:drop-shadow(0 0 4px var(--acc))}
@keyframes giraBorda{to{--ang:360deg}}
.indicador{box-shadow:0 0 18px -6px var(--acc)}
/* ao trocar de item, a borda dá um giro rápido antes de seguir no ritmo normal */
.indicador.novo::after{animation:giraRapido .7s cubic-bezier(.16,1,.3,1),giraBorda 2.6s .7s linear infinite}
@keyframes giraRapido{from{--ang:-180deg}to{--ang:360deg}}
.m-tit{font-size:11.5px;font-weight:600;color:var(--mut2);padding:14px 11px 6px}

@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

.trilha{font-family:var(--f-mono);font-size:12.5px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.busca input{width:100%;font-size:14px;background:var(--s1);border:1px solid var(--line2);border-radius:11px;padding:10px 40px 10px 38px;transition:border-color .2s,box-shadow .2s}

.setor-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

.ic svg{width:21px;height:21px;stroke:var(--acc);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sc-n{font-family:var(--f-mono);font-size:26px;line-height:1}
.sc h2{font-family:var(--f-tit);font-size:21px;font-weight:600;line-height:1.15}
.sc ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px}

.bloco{margin-bottom:32px}

.host{font-family:var(--f-mono);font-size:11px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
div.lk{opacity:.6}
.sl{font-family:var(--f-mono);font-size:11.5px;color:var(--conf)}
.vazio{border:1px dashed var(--line2);border-radius:14px;padding:34px;text-align:center;color:var(--mut);font-size:14px;background:color-mix(in srgb,var(--cor) 6%,rgba(10,12,14,.6))}
.vazio b{display:block;font-family:var(--f-tit);color:var(--txt);font-size:18px;margin-bottom:6px}
.vazio button{color:var(--acc);text-decoration:underline}
.entra{opacity:0;transform:translateY(10px);animation:entra .55s var(--ease) forwards;animation-delay:calc(var(--i,0)*45ms)}


/* =================== fundo do sistema: o lado da arte da empresa =================== */
.fundo-emp{position:fixed;top:0;bottom:0;left:var(--side-w);right:0;z-index:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .8s var(--ease)}
.fundo-emp.on{opacity:1}
.fundo-emp i{position:absolute;top:0;bottom:0;left:-100%;width:200%;background:var(--arte) center bottom/cover no-repeat;opacity:.62;
  animation:respira 22s ease-in-out infinite alternate}
/* Vitalbor usa a metade esquerda da arte, espelhada, para os anéis ficarem à direita do conteúdo */
.fundo-emp.esq i{transform:scaleX(-1)}
@keyframes respira{to{scale:1.06}}
/* véu escuro na área do texto, a peça aparece à direita e embaixo */
.fundo-emp::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 88%,transparent) 30%,color-mix(in srgb,var(--bg) 35%,transparent) 70%,transparent 100%),
             linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 40%,transparent) 38%,transparent 60%)}
#app .main{position:relative;z-index:1}

/* =================== transição de espelho entre as telas =================== */
#empresas{position:absolute;inset:0;overflow:hidden;transform-origin:50% 50%;backface-visibility:hidden}
#app{transform-origin:50% 50vh}
.giro-sai,.giro-entra{position:relative;isolation:isolate}
.giro-sai{animation:giroSai .6s cubic-bezier(.55,.05,.7,.2) forwards;pointer-events:none}
@keyframes giroSai{to{transform:perspective(1600px) rotateY(calc(var(--giro) * 90deg)) scale(.92)}}
.giro-entra{animation:giroEntra .85s cubic-bezier(.16,1,.3,1) both}
@keyframes giroEntra{from{transform:perspective(1600px) rotateY(calc(var(--giro) * -90deg)) scale(.92)}to{transform:none}}
/* a cor da empresa toma conta da tela no meio do giro */
.giro-sai::after,.giro-entra::after{content:'';position:absolute;inset:0;z-index:600;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,color-mix(in srgb,var(--vira-cor) 85%,#fff 15%),color-mix(in srgb,var(--vira-cor) 70%,#000) 75%)}
.giro-sai::after{animation:tintaSobe .6s ease-in forwards}
.giro-entra::after{animation:tintaDesce .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes tintaSobe{from{opacity:0}to{opacity:.95}}
@keyframes tintaDesce{from{opacity:.95}to{opacity:0}}
/* reflexo de espelho passando pela tela */
.giro-sai::before,.giro-entra::before{content:'';position:absolute;inset:0;z-index:601;pointer-events:none;
  background:linear-gradient(calc(var(--giro) * 75deg),transparent 35%,rgba(255,255,255,.3) 48%,rgba(255,255,255,.06) 54%,transparent 64%);
  background-size:300% 100%;mix-blend-mode:overlay}
.giro-sai::before{animation:reflexo .6s ease-in forwards}
.giro-entra::before{animation:reflexo .85s ease-out reverse forwards}
@keyframes reflexo{from{background-position:100% 0}to{background-position:0 0}}
/* barra lateral chega deslizando depois do giro */
body.chegando .side{animation:ladoEntra .75s .3s cubic-bezier(.16,1,.3,1) both}
body.chegando .topo,body.chegando .conteudo{animation:sobe .7s .45s cubic-bezier(.16,1,.3,1) both}
@keyframes ladoEntra{from{transform:translateX(-100%);opacity:0}to{transform:none;opacity:1}}
@keyframes sobe{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:920px){body.chegando .side{animation:none}}
/* atrás da tela que gira aparece a cor da empresa, não um vazio preto */
html.girando #escolha,html.girando body{background:radial-gradient(110% 90% at 50% 40%,color-mix(in srgb,var(--vira-cor) 75%,#fff 10%),color-mix(in srgb,var(--vira-cor) 45%,#000) 80%) fixed}

@keyframes entra{to{opacity:1;transform:none}}
/* =================== botão de configurações =================== */
.cfg-btn{position:fixed;z-index:350;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:var(--txt);
  background:var(--s2);border:1px solid var(--line2);box-shadow:0 12px 30px -8px rgba(0,0,0,.7);transition:transform .3s var(--ease),border-color .3s,left .4s var(--ease)}
.cfg-btn svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .8s var(--ease)}

.cfg-item svg{transition:transform .8s var(--ease)}
.cfg-item:hover svg{transform:rotate(120deg)}

/* =================== painel de configurações =================== */

  transform:translateX(-102%);transition:transform .45s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.cfg-aberto .cfg{transform:none}

.cfg-h{display:flex;align-items:center;gap:12px;padding:20px 22px 14px}

.cfg-h .fechar{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center}
.cfg-h .fechar svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.cfg-aviso{margin:0 22px 12px;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.45}

.abas{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}
.aba{position:relative;padding:11px 12px;font-size:14px;font-weight:600;color:var(--mut)}
.aba:hover{color:var(--txt)}
.aba[aria-selected="true"]{color:var(--txt)}
.aba[aria-selected="true"]::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.aba .qt{font-family:var(--f-mono);font-size:11px;color:var(--mut2);margin-left:4px}
.cfg-corpo{flex:1;overflow-y:auto;padding:18px 22px 30px}
.cfg-acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;
  border:1px solid var(--line2);background:var(--s2);transition:all .2s}
.btn:hover{border-color:var(--acc)}
.btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}

.lista{display:grid;gap:8px}
.reg{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.reg .bola{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.reg .info{flex:1;min-width:0}

.reg .mini:hover{color:var(--txt);border-color:var(--line2)}

.icones{display:flex;flex-wrap:wrap;gap:6px}

.icones svg{width:18px;height:18px;stroke:var(--txt);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.form-pe{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;align-items:center}
.form-pe .erro{margin-right:auto;font-size:13px;color:var(--conf)}
.senha-box{display:flex;gap:10px;align-items:flex-end;padding:16px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);margin-bottom:16px}
.senha-box .campo{flex:1}

.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);opacity:0;z-index:700;background:var(--s3);border:1px solid var(--line2);
  color:var(--txt);font-size:13.5px;padding:11px 18px;border-radius:11px;transition:all .3s var(--ease);pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.erro{border-color:var(--conf);color:#FECACA}
.veu{display:none}

@media (max-width:920px){
  .fundo-emp{left:0}
  .fundo-emp::after{background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 80%,transparent) 45%,color-mix(in srgb,var(--bg) 40%,transparent) 100%)}
  .side{transform:translateX(-100%);transition:transform .4s var(--ease)}
  body.menu-aberto .side{transform:none}
  body.menu-aberto .veu{display:block;position:fixed;inset:0;background:rgba(5,9,7,.6);z-index:290}
  .main{margin-left:0}
  .hamb{display:grid}
  .topo{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;flex-wrap:wrap}
  .busca{order:3;width:100%;margin-left:0}.busca kbd{display:none}
  .conteudo{padding:24px 16px 110px}
  .setor-cards,.links{grid-template-columns:minmax(0,1fr)}
  .cfg-btn{left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .campos{grid-template-columns:minmax(0,1fr)}
  body::after{width:520px;height:520px;top:-260px;right:-220px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .indicador::after{background:var(--acc);opacity:.6}
  .entra,.marca-topo{opacity:1;transform:none}
  .alvo{opacity:1;transform:translateX(-50%)}
  .marca-topo{transform:translateX(-50%)}
}
</style>
</head>

  // a arte cobre a tela como "cover"; os botões acompanham a posição real dos logos
  function posicionarArte(){
    const p=$("palco");if(!p||$("escolha").hidden)return;
    const W=innerWidth,H=innerHeight,k=Math.max(W/ARTE.w,H/ARTE.h),w=ARTE.w*k,h=ARTE.h*k,x0=(W-w)/2,y0=h>H?Math.max(H-h,-0.06*h):(H-h)/2;
    Object.assign(p.style,{width:w+"px",height:h+"px",left:x0+"px",top:y0+"px"});
    const retrato=matchMedia("(orientation:portrait) and (max-width:900px)").matches;
    document.querySelectorAll("#escolha [data-pos]").forEach(el=>{
      if(retrato){el.style.left="";el.style.top="";return;}
      const lado=el.closest(".lado"),ladoX=lado.classList.contains("esq")?0:W/2,[px,py,pr]=el.dataset.pos.split(",").map(Number);
      el.style.left=(x0+w*px/100-ladoX)+"px";el.style.top=(y0+h*py/100)+"px";

    if(aba==="empresas"){
      h+=`<div class="cfg-acoes"><span style="flex:1;color:var(--mut);font-size:13px">As empresas aparecem como cards na tela inicial.</span>${novoBtn}</div>`+formHTML();
      lista=empresas().map(e=>`<div class="reg"><span class="bola" style="background:${esc(e.cor)}"></span><div class="info"><b>${esc(e.nome)}</b><small>${setoresDe(e.id).length} setores, ${DB.links.filter(l=>l.empresa===e.id).length} links</small></div>${acoes(e)}</div>`);
    }else if(aba==="setores"){
      h+=`<div class="cfg-acoes">${selEmp}${novoBtn}</div>`+formHTML();
      lista=setoresDe(filtroEmp).map(s=>`<div class="reg"><span class="ic" style="width:34px;height:34px">${SVG(ICONES[s.icone]||ICONES.padrao)}</span><div class="info"><b>${esc(s.nome)}</b><small>${subsDe(s.id).length} sub-setores, ${DB.links.filter(l=>l.setor===s.id).length} links</small></div>${acoes(s)}</div>`);
    }else if(aba==="subsetores"){
      h+=`<div class="cfg-acoes">${selEmp}${selSetor}${novoBtn}</div>`+formHTML();
      lista=DB.subsetores.filter(u=>setoresFiltro.some(s=>s.id===u.setor)&&(!filtroSetor||u.setor===filtroSetor)).sort(porOrdem)
        .map(u=>`<div class="reg"><div class="info"><b>${esc(u.nome)}</b><small>${esc(nomeSetor(u.setor))}, ${DB.links.filter(l=>l.subsetor===u.id).length} links</small></div>${acoes(u)}</div>`);
    }else{
      h+=`<div class="cfg-acoes">${selEmp}${selSetor}${novoBtn}</div>`+formHTML();
      lista=linksDe(l=>l.empresa===filtroEmp&&(!filtroSetor||l.setor===filtroSetor)).map(l=>{const st=STATUS[l.situacao]||STATUS.producao;
        return `<div class="reg"><span class="bola" style="background:${st.cor};border-radius:50%;width:9px;height:9px"></span><div class="info"><b>${esc(l.nome)}</b><small>${esc(nomeSetor(l.setor))}${l.subsetor?" / "+esc(nomeSub(l.subsetor)):""} · ${esc(host(l.url)||"sem link")}</small></div>${acoes(l)}</div>`;});
    }
    h+=`<div class="lista">${lista.length?lista.join(""):`<div class="vazio">Nada cadastrado aqui ainda. Use o botão Novo.</div>`}</div>`;
    $("cfgCorpo").innerHTML=h;
  }

  function formHTML(){
    if(!editando)return"";
    const r=editando.dado,novo=editando.novo,t={empresas:"empresa",setores:"setor",subsetores:"sub-setor",links:"link"}[aba];
    const opt=(arr,sel,vazioTxt)=>(vazioTxt!=null?`<option value="">${vazioTxt}</option>`:"")+arr.map(x=>`<option value="${esc(x.id)}"${x.id===sel?" selected":""}>${esc(x.nome)}</option>`).join("");
    let c="";
    if(aba==="empresas")c=`<div class="campo cheio"><label for="fNome">Nome</label><input id="fNome" value="${esc(r.nome)}" placeholder="Ex.: Vitalbor"></div>
      <div class="campo"><label for="fCor">Cor da marca</label><input id="fCor" type="color" value="${esc(r.cor||"#32923C")}"></div>
      <div class="campo"><label for="fOrdem">Ordem</label><input id="fOrdem" type="number" value="${esc(r.ordem)}"></div>
      <div class="campo cheio"><label for="fLogo">Link do logo (opcional)</label><input id="fLogo" value="${esc(r.logo)}" placeholder="https://... (PNG com fundo transparente)"></div>`;
    if(aba==="setores")c=`<div class="campo"><label for="fEmpresa">Empresa</label><select id="fEmpresa">${opt(empresas(),r.empresa)}</select></div>
      <div class="campo"><label for="fNome">Nome do setor</label><input id="fNome" value="${esc(r.nome)}" placeholder="Ex.: Produção"></div>
      <div class="campo"><label for="fOrdem">Ordem</label><input id="fOrdem" type="number" value="${esc(r.ordem)}"></div>
      <div class="campo cheio"><label>Ícone</label><div class="icones" id="fIcone">${Object.keys(ICONES).map(k=>`<button type="button" data-icone="${k}" aria-pressed="${k===(r.icone||"padrao")}" title="${k}">${SVG(ICONES[k])}</button>`).join("")}</div></div>`;
    if(aba==="subsetores"){const sts=empresas().flatMap(e=>setoresDe(e.id).map(s=>({id:s.id,nome:e.nome+" / "+s.nome})));
      c=`<div class="campo cheio"><label for="fSetorF">Setor</label><select id="fSetorF">${opt(sts,r.setor)}</select></div>
      <div class="campo"><label for="fNome">Nome do sub-setor</label><input id="fNome" value="${esc(r.nome)}" placeholder="Ex.: Injetoras"></div>
      <div class="campo"><label for="fOrdem">Ordem</label><input id="fOrdem" type="number" value="${esc(r.ordem)}"></div>`;}
    if(aba==="links")c=`<div class="campo"><label for="fEmpresa">Empresa</label><select id="fEmpresa">${opt(empresas(),r.empresa)}</select></div>
      <div class="campo"><label for="fSetorF">Setor</label><select id="fSetorF">${opt(setoresDe(r.empresa),r.setor,"Escolha o setor")}</select></div>
      <div class="campo"><label for="fSub">Sub-setor (opcional)</label><select id="fSub">${opt(subsDe(r.setor),r.subsetor,"Nenhum")}</select></div>
      <div class="campo"><label for="fSit">Situação</label><select id="fSit">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}"${k===(r.situacao||"producao")?" selected":""}>${v.txt}</option>`).join("")}</select></div>
      <div class="campo cheio"><label for="fNome">Nome do sistema</label><input id="fNome" value="${esc(r.nome)}" placeholder="Ex.: Controle de Terceiros"></div>
      <div class="campo cheio"><label for="fDesc">Descrição curta</label><input id="fDesc" value="${esc(r.descricao)}" placeholder="Opcional"></div>
      <div class="campo cheio"><label for="fUrl">Link</label><input id="fUrl" value="${esc(r.url)}" placeholder="https://..." inputmode="url"></div>
      <div class="campo"><label for="fOrdem">Ordem</label><input id="fOrdem" type="number" value="${esc(r.ordem)}"></div>`;
    return `<div class="form"><h3>${novo?"Novo "+t:"Editar "+t}</h3><div class="campos">${c}</div>
      <div class="form-pe"><span class="erro" id="fErro"></span><button class="btn" data-cancelar>Cancelar</button><button class="btn pri" data-salvar>Salvar</button></div></div>`;
  }

  $("abas").addEventListener("click",ev=>{const b=ev.target.closest("[data-aba]");if(!b)return;aba=b.dataset.aba;editando=null;desenharCfg();});
  $("cfgCorpo").addEventListener("change",ev=>{
    const id=ev.target.id;
    if(id==="fEmp"){filtroEmp=ev.target.value;filtroSetor="";desenharCfg();return;}
    if(id==="fSetor"){filtroSetor=ev.target.value;desenharCfg();return;}
    if(!editando)return;
    lerForm();
    if(aba==="links"&&(id==="fEmpresa"||id==="fSetorF")){if(id==="fEmpresa"){editando.dado.setor="";}editando.dado.subsetor="";desenharCfg();}
  });
  function lerForm(){
    const d=editando.dado,v=id=>{const e=$(id);return e?e.value.trim():undefined;};
    const set=(k,id)=>{const x=v(id);if(x!==undefined)d[k]=x;};
    set("nome","fNome");set("cor","fCor");set("logo","fLogo");set("ordem","fOrdem");set("empresa","fEmpresa");
    set("setor","fSetorF");set("subsetor","fSub");set("situacao","fSit");set("descricao","fDesc");set("url","fUrl");
  }
  $("cfgCorpo").addEventListener("click",async ev=>{
    const t=ev.target;
    if(t.closest("#cfgEntrar")){const s=$("cfgSenha").value;if(!s)return toast("Digite a senha",true);
      t.disabled=true;try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({senha:s,acao:"testar"})});
        const d=await r.json();if(d.erro)throw new Error(d.erro);senha=s;toast("Edição liberada");desenharCfg();}catch(e){toast(msgRede(e),true);t.disabled=false;}return;}
    const ic=t.closest("[data-icone]");if(ic){editando.dado.icone=ic.dataset.icone;document.querySelectorAll("#fIcone button").forEach(b=>b.setAttribute("aria-pressed",String(b===ic)));return;}
    if(t.closest("[data-novo]")){
      if(!podeEditar())return;
      const prox=arr=>arr.reduce((m,x)=>Math.max(m,num(x.ordem)===999?0:num(x.ordem)),0)+1;
      const base={empresas:{id:"",nome:"",cor:"#32923C",logo:"",ordem:prox(DB.empresas)},
        setores:{id:"",empresa:filtroEmp,nome:"",icone:"padrao",ordem:prox(setoresDe(filtroEmp))},
        subsetores:{id:"",setor:filtroSetor||(setoresDe(filtroEmp)[0]||{}).id||"",nome:"",ordem:1},
        links:{id:"",empresa:filtroEmp,setor:filtroSetor,subsetor:"",nome:"",descricao:"",url:"",situacao:"producao",ordem:prox(DB.links)}}[aba];
      editando={novo:true,dado:base};desenharCfg();setTimeout(()=>{const f=$("fNome");if(f)f.focus();},50);return;}
    const ed=t.closest("[data-editar]");if(ed){if(!podeEditar())return;editando={novo:false,dado:{...DB[aba].find(x=>x.id===ed.dataset.editar)}};desenharCfg();$("cfgCorpo").scrollTo({top:0,behavior:"smooth"});return;}
    if(t.closest("[data-cancelar]")){editando=null;desenharCfg();return;}
    if(t.closest("[data-salvar]")){
      lerForm();const d=editando.dado,erro=m=>{$("fErro").textContent=m;};
      if(!d.nome)return erro("Preencha o nome.");
      if(aba==="setores"&&!d.empresa)return erro("Escolha a empresa.");
      if(aba==="subsetores"&&!d.setor)return erro("Escolha o setor.");
      if(aba==="links"){if(!d.setor)return erro("Escolha o setor.");
        if(d.url){if(!/^https?:\/\//i.test(d.url))d.url="https://"+d.url;try{new URL(d.url);}catch(e){return erro("Esse link não é válido.");}}}
      if(aba==="empresas"&&!d.id)d.id=norm(d.nome).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||novoId("e");
      if(aba==="empresas"&&editando.novo&&DB.empresas.some(e=>e.id===d.id))d.id=d.id+"-"+Date.now().toString(36).slice(-3);
      if(!d.id)d.id=novoId({setores:"s",subsetores:"u",links:"l"}[aba]);
      const btn=t.closest("[data-salvar]");btn.disabled=true;erro("Salvando...");
      try{await gravar("salvar",aba,d);editando=null;toast("Salvo");desenharCfg();tudo(false);}
      catch(e){btn.disabled=false;erro(msgRede(e)+" Nada foi gravado.");}
      return;}
    const ex=t.closest("[data-excluir]");if(ex){
      if(!podeEditar())return;
      const r=DB[aba].find(x=>x.id===ex.dataset.excluir),msg=bloqueio(aba,r.id);
      if(msg)return toast(msg,true);
      if(!confirm(`Excluir "${r.nome}"?`))return;
      try{await gravar("excluir",aba,r.id);toast("Excluído");
        if(aba==="empresas"&&rota.emp===r.id)ir("#/");desenharCfg();tudo(false);}
      catch(e){toast(e.message||"Não excluiu: sem conexão.",true);}
    }
  });
  function podeEditar(){if(DEMO||senha)return true;toast("Digite a senha de edição primeiro",true);const s=$("cfgSenha");if(s)s.focus();return false;}

  let tt;function toast(m,erro){const t=$("toast");t.textContent=m;t.classList.toggle("erro",!!erro);t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3400);}

  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!DEMO&&!document.body.classList.contains("cfg-aberto"))carregar(false);});
  lerRota();carregar(false);
})();
</script>
</body>
</html>
